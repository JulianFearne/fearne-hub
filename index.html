<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fearne Hub</title>
    <meta name="description" content="The Fearne family's home base." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7a2e4e" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply any saved theme choice before first paint, so there's no
      // light-then-dark flash while React boots.
      ;(function () {
        try {
          var stored = localStorage.getItem('fh-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA routing fix: see public/404.html for the other half -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
