<!doctype html>
<!--
  GitHub Pages only serves static files, so a direct link to e.g.
  fearne.org/recipes has no matching file and GitHub serves this 404 page
  instead. This script rewrites the URL into a query string and redirects
  to the real index.html, where a tiny matching script in main.jsx converts
  it back — so React Router sees the original path and renders correctly.
  Standard workaround for SPAs on GitHub Pages.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fearne Hub</title>
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
